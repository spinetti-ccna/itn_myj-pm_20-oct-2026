  <style>

    :root {

      --primary-color: #0b3c5d;      /* Azul Cisco institucional */

      --secondary-color: #0288d1;    /* Azul dinámico / enlaces */

      --accent-color: #d92525;       /* Rojo de acento */

      --bg-color: #f4f7f9;           /* Fondo gris claro limpio */

      --card-bg: #ffffff;

      --text-main: #1f2937;

      --text-muted: #4b5563;

      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);

      --transition: all 0.25s ease-in-out;

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    body {

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      background-color: var(--bg-color);

      color: var(--text-main);

      line-height: 1.5;

      display: flex;

      flex-direction: column;

      min-height: 100vh;

    }


    .container {

      max-width: 1300px;

      margin: 0 auto;

      padding: 20px 15px;

      width: 100%;

      flex: 1;

    }


    /* HEADER */

    .header-card {

      background: var(--card-bg);

      border-radius: 12px;

      box-shadow: var(--shadow);

      padding: 25px 20px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;

      border-top: 5px solid var(--primary-color);

    }


    .header-logo {

      width: 115px;

      height: 115px;

      border-radius: 50%;

      object-fit: cover;

      border: none;

      box-shadow: var(--shadow);

      background-color: #ffffff;

      flex-shrink: 0;

    }


    .header-content {

      text-align: center;

      flex: 1;

    }


    .header-content h1 {

      font-size: 1.5rem;

      color: var(--primary-color);

      margin-bottom: 4px;

    }


    .header-content h2 {

      font-size: 1.05rem;

      font-weight: 500;

      color: var(--text-muted);

      margin-bottom: 4px;

    }


    .header-content .instructor {

      font-size: 1.15rem;

      color: var(--text-main);

      font-weight: 600;

      margin-top: 6px;

    }


    /* GRID DE CLASES */

    .classes-grid {

      display: grid;

      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));

      gap: 24px;

    }


    .class-card {

      background: var(--card-bg);

      border-radius: 12px;

      overflow: hidden;

      box-shadow: var(--shadow);

      display: flex;

      flex-direction: column;

      transition: var(--transition);

      border: 1px solid #e2e8f0;

    }


    .class-card:hover {

      transform: translateY(-5px);

      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);

    }


    .thumbnail-container {

      position: relative;

      width: 100%;

      padding-top: 56.25%; /* 16:9 Aspect Ratio */

      background-color: #000;

      overflow: hidden;

      display: block;

    }


    .thumbnail-container img {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      transition: transform 0.3s ease;

    }


    .class-card:hover .thumbnail-container img {

      transform: scale(1.03);

    }


    .play-overlay {

      position: absolute;

      inset: 0;

      background: rgba(0, 0, 0, 0.25);

      display: flex;

      align-items: center;

      justify-content: center;

      opacity: 0;

      transition: var(--transition);

    }


    .class-card:hover .play-overlay {

      opacity: 1;

    }


    .play-btn-circle {

      background: rgba(11, 60, 93, 0.92);

      width: 52px;

      height: 52px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #fff;

      font-size: 1.4rem;

      padding-left: 4px;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);

      border: 1px solid rgba(255, 255, 255, 0.25);

    }

   /* BARRA DE BÚSQUEDA REDONDEADA Y COMPACTA */
    .search-wrapper {
      max-width: 550px;              /* <-- Controla el ancho máximo (ajústalo a tu gusto: 500px, 600px, etc.) */
      margin: 0 auto 25px auto;      /* <-- Centra la barra horizontalmente */
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 10px 20px 10px 42px;  /* <-- 10px arriba/abajo lo hace más fino y compacto */
      font-size: 0.95rem;            /* <-- Tamaño de letra proporcionado */
      border: 1px solid #cbd5e1;
      border-radius: 50px;           /* <-- 50px crea el redondeado total en los extremos izquierdo y derecho */
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      outline: none;
      transition: var(--transition);
    }


    /* FOOTER */

    footer {

      background: var(--card-bg);

      border-top: 1px solid #e2e8f0;

      padding: 20px;

      text-align: center;

      font-size: 0.95rem;

      color: var(--text-muted);

      margin-top: 40px;

    }


    footer a {

      color: var(--secondary-color);

      text-decoration: none;

      font-weight: 500;

    }


    footer a:hover {

      text-decoration: underline;

    }


    /* RESPONSIVE */

      .header-card {

        flex-direction: column;

        text-align: center;

      }

      .header-logo {

        width: 100px;

        height: 100px;

      }

      .classes-grid {

        grid-template-columns: 1fr;

      }

    }

  </style>

  <!-- SCRIPT DE BÚSQUEDA EN TIEMPO REAL -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('courseSearch');
      const cards = Array.from(document.querySelectorAll('.class-card'));
      const noResults = document.getElementById('noResults');

      const normalizeText = (text) => {
        return (text || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');
      };

      searchInput.addEventListener('input', (e) => {
        const query = normalizeText(e.target.value.trim());
        let matchesCount = 0;

        cards.forEach((card) => {
          const searchableContent = [
            card.getAttribute('data-class'),
            card.getAttribute('data-title'),
            card.getAttribute('data-date'),
            card.getAttribute('data-keywords')
          ].join(' ');

          const normalizedContent = normalizeText(searchableContent);

          if (!query || normalizedContent.includes(query)) {
            card.style.display = 'flex';
            matchesCount++;
          } else {
            card.style.display = 'none';
          }
        });

        noResults.style.display = matchesCount === 0 ? 'block' : 'none';
      });
    });
  </script>
